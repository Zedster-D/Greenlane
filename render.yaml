services:
  - type: web
    name: greenlane-backend
    env: python
    rootDir: supply-chain-sustainability-main/greenlane-ai/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
